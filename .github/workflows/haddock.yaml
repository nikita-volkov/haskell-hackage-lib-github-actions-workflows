name: Haddock

on:
  workflow_call:
    inputs:
      ghc:
        description: GHC version to use for the Haddock generation. For example, "8.10.7" or "latest".
        type: string
        default: latest
      version:
        description: Version to set in the .cabal file before generating the Haddock docs (e.g. for a release). Leave empty to build with whatever version is already in the tree.
        type: string
        default: ""

jobs:

  haddock:
    name: haddock (GHC ${{ inputs.ghc }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Restore cached GHC toolchain
        uses: actions/cache/restore@v5
        id: ghcup-cache
        with:
          path: ~/.ghcup
          key: ${{ runner.os }}-ghcup-${{ inputs.ghc }}

      - name: Set up build tools
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ inputs.ghc }}

      - name: Save GHC toolchain cache
        uses: actions/cache/save@v5
        if: ${{ steps.ghcup-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.ghcup
          key: ${{ steps.ghcup-cache.outputs.cache-primary-key }}

      - name: Set package version
        if: inputs.version != ''
        uses: nikita-volkov/edit-cabal-version.github-action@v1
        with:
          mode: set
          set-value: ${{ inputs.version }}

      - name: Configure
        shell: bash
        run: cabal configure --enable-documentation

      - name: Generate the plan
        shell: bash
        run: cabal build all --enable-documentation --dry-run

      - name: Restore cached dependencies
        uses: actions/cache/restore@v6
        id: cache
        env:
          key: build-haddock-${{ runner.os }}-${{ steps.setup.outputs.cabal-version }}-${{ steps.setup.outputs.ghc-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}

      - name: Install dependencies
        shell: bash
        run: |
          cabal update
          cabal build all --only-dependencies --enable-documentation -j +RTS -A128m -n2m -N -RTS -O0 --ghc-options="-j"

      - name: Save dependencies cache
        uses: actions/cache/save@v6
        if: ${{ steps.cache.outputs.cache-primary-key != steps.cache.outputs.cache-matched-key }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Extract package name
        id: package
        shell: bash
        run: |
          cabal_file=$(find . -maxdepth 1 -name "*.cabal" -print -quit)
          package_name=$(awk -F ":[[:space:]]*" 'tolower($1)=="name" { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2 }' < "$cabal_file")
          echo "name=$package_name" >> "$GITHUB_OUTPUT"

      # Plain `cabal haddock` emits a standard docs tree that includes a
      # top-level index.html (the module contents page), which GitHub Pages
      # serves as the site root. `cabal haddock --haddock-for-hackage` (run
      # below for the Hackage upload) omits that index.html, so the Pages docs
      # are built from a separate plain invocation.
      #
      # The package name is passed explicitly to work around a Cabal quirk
      # where otherwise docs may be generated only for the internal libraries.
      - name: Build docs for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          cabal haddock "${{ steps.package.outputs.name }}"

      - name: Stage docs for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          package="${{ steps.package.outputs.name }}"
          haddock_dir=$(find dist-newstyle -type d -path "*/doc/html/$package" -print -quit)
          if [ -z "$haddock_dir" ]; then
            echo "ERROR: could not locate Haddock output for package '$package'" >&2
            exit 1
          fi
          rm -rf pages-docs
          mkdir -p pages-docs
          cp -a "$haddock_dir/." pages-docs/
          if [ ! -f pages-docs/index.html ]; then
            echo "ERROR: no index.html in $haddock_dir; the Pages site root would 404" >&2
            exit 1
          fi

      - name: Enrich documentation footers
        shell: bash
        run: |
          COMMIT_HASH="${{ github.sha }}"
          REPO_URL="https://github.com/${{ github.repository }}/tree/${COMMIT_HASH}"
          find pages-docs -name "*.html" -type f -exec sed -i \
            "s|<div id=\"footer\"><p>Produced by <a href=\"http://www.haskell.org/haddock/\">Haddock</a>|<div id=\"footer\"><p>Produced from commit <a href=\"${REPO_URL}\">${COMMIT_HASH:0:7}</a> by <a href=\"http://www.haskell.org/haddock/\">Haddock</a>|g" {} \;

      - name: Add .nojekyll (avoid Jekyll processing)
        run: touch pages-docs/.nojekyll

      - name: Upload the GitHub Pages docs
        uses: actions/upload-artifact@v7
        with:
          name: pages-docs
          path: pages-docs

      - name: Build Haddock for Hackage
        shell: bash
        run: |
          set -euo pipefail
          cabal haddock --haddock-for-hackage "${{ steps.package.outputs.name }}"

      - name: Upload the Hackage docs tarball
        uses: actions/upload-artifact@v7
        with:
          name: hackage-docs
          path: dist-newstyle/*-docs.tar.gz
