name: Release to Hackage

on:
  workflow_call:
    inputs:
      upload-docs:
        description: Build Haddock and upload it to Hackage alongside the source dist.
        type: boolean
        default: false
    secrets:
      HACKAGE_TOKEN:
        required: false

permissions:
  contents: write

jobs:

  detect:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect the version to release
        id: detect
        uses: nikita-volkov/changelog-driven-release.github-action@v1

  release:
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: hackage
      url: ${{ steps.generate-hackage-url.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Re-detect the version to release (under the lock)
        id: detect
        uses: nikita-volkov/changelog-driven-release.github-action@v1

      - name: Set package version
        if: steps.detect.outputs.ready == 'true'
        uses: nikita-volkov/edit-cabal-version.github-action@v1
        with:
          mode: set
          set-value: ${{ steps.detect.outputs.version }}

      - name: Extract package name and generate Hackage URL
        if: steps.detect.outputs.ready == 'true'
        id: generate-hackage-url
        run: |
          cabal_file=$(find . -maxdepth 1 -name "*.cabal" -print -quit)
          package_name=$(awk -F ":[[:space:]]*" 'tolower($1)=="name" { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2 }' < "$cabal_file")
          if [ "${{ steps.detect.outputs.candidate }}" = "true" ]; then
            url="https://hackage.haskell.org/package/${package_name}/candidates"
          else
            url="https://hackage.haskell.org/package/${package_name}-${{ steps.detect.outputs.version }}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Generate source distribution
        if: steps.detect.outputs.ready == 'true'
        run: cabal sdist

      - name: Generate Haddock for Hackage
        if: steps.detect.outputs.ready == 'true' && inputs.upload-docs
        shell: bash
        # We're doing it in such a complicated way to work around a bug in Cabal,
        # due to which it may generate documentation dist only for the internal libs,
        # if the name of the package is not specified thus:
        # `cabal haddock --haddock-for-hackage $package_name`.
        run: |
          set -euo pipefail
          cabal_file=$(find . -maxdepth 1 -name "*.cabal" -print -quit)
          package_name=$(awk -F ":[[:space:]]*" 'tolower($1)=="name" { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2 }' < "$cabal_file")
          cabal update
          cabal haddock --haddock-for-hackage "$package_name"

      - name: Publish on Hackage (with docs)
        if: steps.detect.outputs.ready == 'true' && inputs.upload-docs
        uses: haskell-actions/hackage-publish@v1.1
        with:
          hackageToken: ${{ secrets.HACKAGE_TOKEN }}
          publish: ${{ steps.detect.outputs.candidate != 'true' }}
          docsPath: dist-newstyle

      - name: Publish on Hackage
        if: steps.detect.outputs.ready == 'true' && !inputs.upload-docs
        uses: haskell-actions/hackage-publish@v1.1
        with:
          hackageToken: ${{ secrets.HACKAGE_TOKEN }}
          publish: ${{ steps.detect.outputs.candidate != 'true' }}

      - name: Commit the version update
        if: steps.detect.outputs.ready == 'true' && steps.detect.outputs.candidate != 'true'
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Set package version to ${{ steps.detect.outputs.version }}
          file_pattern: "*.cabal CHANGELOG.md"

      - name: Create GitHub release
        if: steps.detect.outputs.ready == 'true' && steps.detect.outputs.candidate != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.detect.outputs.version }}
          name: v${{ steps.detect.outputs.version }}
          body: ${{ steps.detect.outputs.notes }}
          target_commitish: ${{ steps.commit.outputs.commit_hash }}
          files: dist-newstyle/sdist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
