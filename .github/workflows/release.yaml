name: Release to Hackage

on:
  workflow_call:
    inputs:
      upload-docs:
        description: Build Haddock and upload it to Hackage alongside the source dist.
        type: boolean
        default: false
      release-candidate:
        description: Publish as a Hackage release candidate instead of a permanent release.
        type: boolean
        default: false
    secrets:
      HACKAGE_TOKEN:
        required: false

permissions:
  contents: write

jobs:

  detect:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect the version to release
        id: detect
        uses: nikita-volkov/changelog-driven-release.github-action@v1

  release:
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: hackage
      url: ${{ steps.generate-hackage-url.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Re-detect the version to release (under the lock)
        id: detect
        uses: nikita-volkov/changelog-driven-release.github-action@v1

      - name: Set package version
        if: steps.detect.outputs.ready == 'true'
        uses: nikita-volkov/edit-cabal-version.github-action@v1
        with:
          mode: set
          set-value: ${{ steps.detect.outputs.version }}

      - name: Prepend a fresh Upcoming section to the changelog
        if: steps.detect.outputs.ready == 'true' && !inputs.release-candidate
        run: |
          set -euo pipefail
          printf '# Upcoming\n\n' | cat - CHANGELOG.md > CHANGELOG.md.new
          mv CHANGELOG.md.new CHANGELOG.md

      - name: Extract package name and generate Hackage URL
        if: steps.detect.outputs.ready == 'true'
        id: generate-hackage-url
        run: |
          cabal_file=$(find . -maxdepth 1 -name "*.cabal" -print -quit)
          package_name=$(awk -F ":[[:space:]]*" 'tolower($1)=="name" { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2 }' < "$cabal_file")
          if [ "${{ inputs.release-candidate }}" = "true" ]; then
            url="https://hackage.haskell.org/package/${package_name}/candidates"
          else
            url="https://hackage.haskell.org/package/${package_name}-${{ steps.detect.outputs.version }}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Generate source distribution
        if: steps.detect.outputs.ready == 'true'
        run: cabal sdist

      - name: Publish on Hackage (with docs)
        if: steps.detect.outputs.ready == 'true' && inputs.upload-docs
        uses: haskell-actions/hackage-publish@v1.1
        with:
          hackageToken: ${{ secrets.HACKAGE_TOKEN }}
          publish: ${{ !inputs.release-candidate }}
          docsPath: dist-newstyle

      - name: Publish on Hackage
        if: steps.detect.outputs.ready == 'true' && !inputs.upload-docs
        uses: haskell-actions/hackage-publish@v1.1
        with:
          hackageToken: ${{ secrets.HACKAGE_TOKEN }}
          publish: ${{ !inputs.release-candidate }}

      - name: Commit the version update
        if: steps.detect.outputs.ready == 'true' && !inputs.release-candidate
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Set package version to ${{ steps.detect.outputs.version }}
          file_pattern: "*.cabal CHANGELOG.md"

      - name: Create release tag
        if: steps.detect.outputs.ready == 'true' && !inputs.release-candidate
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ github.token }}
          custom_tag: ${{ steps.detect.outputs.version }}
          tag_prefix: v
          commit_sha: ${{ steps.commit.outputs.commit_hash }}
