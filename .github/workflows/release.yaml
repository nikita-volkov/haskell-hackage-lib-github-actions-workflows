name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Version to release.
        type: string
        required: true
      candidate:
        description: Whether this is a release candidate.
        type: boolean
        default: false
      notes:
        description: Release notes.
        type: string
        default: ""
      upload-docs:
        description: Whether Haddock docs were built and should be published to Hackage.
        type: boolean
        default: false
    secrets:
      HACKAGE_TOKEN:
        required: false

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:

  release:
    runs-on: ubuntu-latest
    environment:
      name: hackage
      url: ${{ steps.generate-hackage-url.outputs.url }}
    steps:
      - name: Check whether this version is already released
        id: check-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Version v${{ inputs.version }} is already released, skipping."
            echo "already-released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.check-tag.outputs.already-released != 'true'
        with:
          fetch-depth: 0

      - name: Set package version
        if: steps.check-tag.outputs.already-released != 'true'
        uses: nikita-volkov/edit-cabal-version.github-action@v1
        with:
          mode: set
          set-value: ${{ inputs.version }}

      - name: Extract package name and generate Hackage URL
        if: steps.check-tag.outputs.already-released != 'true'
        id: generate-hackage-url
        run: |
          cabal_file=$(find . -maxdepth 1 -name "*.cabal" -print -quit)
          package_name=$(awk -F ":[[:space:]]*" 'tolower($1)=="name" { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2 }' < "$cabal_file")
          if [ "${{ inputs.candidate }}" = "true" ]; then
            url="https://hackage.haskell.org/package/${package_name}/candidates"
          else
            url="https://hackage.haskell.org/package/${package_name}-${{ inputs.version }}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Download the source distribution
        if: steps.check-tag.outputs.already-released != 'true'
        uses: actions/download-artifact@v4
        with:
          name: sdist

      - name: Download the Hackage docs tarball
        if: steps.check-tag.outputs.already-released != 'true' && inputs.upload-docs
        uses: actions/download-artifact@v4
        with:
          name: hackage-docs

      - name: Publish on Hackage
        if: steps.check-tag.outputs.already-released != 'true'
        env:
          HACKAGE_SERVER: http://hackage.haskell.org
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
          PUBLISH: ${{ !inputs.candidate }}
          PACKAGES_PATH: dist-newstyle/sdist/
          DOCS_PATH: ${{ inputs.upload-docs && 'dist-newstyle' || '' }}
        run: |
          HACKAGE_AUTH_HEADER="Authorization: X-ApiKey ${HACKAGE_TOKEN}"

          for PACKAGE_TARBALL in $(find "${PACKAGES_PATH}" -maxdepth 1 -name "*.tar.gz"); do
              PACKAGE_NAME=$(basename ${PACKAGE_TARBALL%.*.*})

              if [ "${PUBLISH}" == "true" ];
                then
                  TARGET_URL="${HACKAGE_SERVER}/packages/upload";
                  PACKAGE_URL="${HACKAGE_SERVER}/package/$PACKAGE_NAME"
                  HACKAGE_STATUS=$(curl --header "${HACKAGE_AUTH_HEADER}" --silent --head -w %{http_code} -XGET --anyauth ${HACKAGE_SERVER}/package/${PACKAGE_NAME} -o /dev/null)
                else
                  TARGET_URL="${HACKAGE_SERVER}/packages/candidates";
                  PACKAGE_URL="${HACKAGE_SERVER}/package/$PACKAGE_NAME/candidate"
                  HACKAGE_STATUS=404
              fi

              DOCS_URL="$PACKAGE_URL/docs"

              if [ "$HACKAGE_STATUS" = "404" ]; then
                echo "Uploading ${PACKAGE_NAME} to ${TARGET_URL}"
                curl -X POST -f --header "${HACKAGE_AUTH_HEADER}" ${TARGET_URL} -F "package=@$PACKAGE_TARBALL"
                echo "Uploaded ${PACKAGE_URL}"

                DOC_FILE_NAME="${DOCS_PATH}/${PACKAGE_NAME}-docs.tar.gz"
                if [ -n "${DOCS_PATH}" ] && [ -f "$DOC_FILE_NAME" ]; then
                  echo "Uploading documentation for ${PACKAGE_NAME} to ${DOCS_URL}"
                  curl -X PUT \
                    -H 'Content-Type: application/x-tar' \
                    -H 'Content-Encoding: gzip' \
                    -H "${HACKAGE_AUTH_HEADER}" \
                    --data-binary "@$DOC_FILE_NAME" \
                    "$DOCS_URL"
                fi

              else
                echo "Package ${PACKAGE_NAME}" already exists on Hackage.
              fi
          done

      - name: Commit the version update
        if: steps.check-tag.outputs.already-released != 'true' && !inputs.candidate
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Set package version to ${{ inputs.version }}
          file_pattern: "*.cabal CHANGELOG.md"

      - name: Create GitHub release
        if: steps.check-tag.outputs.already-released != 'true' && !inputs.candidate
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ inputs.notes }}
          target_commitish: ${{ steps.commit.outputs.commit_hash }}
          files: dist-newstyle/sdist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
