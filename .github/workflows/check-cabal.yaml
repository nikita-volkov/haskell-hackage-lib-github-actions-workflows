name: Run "cabal check" with the latest setup

on:
  workflow_call:
    inputs:
      ghc:
        description: GHC version to use. For example, "8.10.7" or "latest".
        type: string
        default: latest

jobs:
  cabal-check:
    runs-on: ubuntu-latest
    steps:
      - name: Restore cached GHC toolchain
        uses: actions/cache/restore@v5
        id: ghcup-cache
        with:
          path: ~/.ghcup
          key: ${{ runner.os }}-ghcup-${{ inputs.ghc }}

      - name: Set up build tools
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ inputs.ghc }}

      - name: Save GHC toolchain cache
        uses: actions/cache/save@v5
        if: ${{ steps.ghcup-cache.outputs.cache-hit != 'true' }}
        with:
          path: ~/.ghcup
          key: ${{ steps.ghcup-cache.outputs.cache-primary-key }}

      - uses: actions/checkout@v6

      - name: Check cabal file
        shell: bash
        run: cabal check
