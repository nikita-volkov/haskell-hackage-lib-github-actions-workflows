name: CI

on:
  workflow_call:
    inputs:
      ghc-oldest:
        description: Oldest GHC version to build with (e.g. "8.10").
        type: string
        default: "8.10"
      ghc-latest:
        description: Latest GHC version to build with (e.g. "latest").
        type: string
        default: latest
      doctest:
        description: Whether to run doctests on the latest build.
        type: boolean
        default: false
      upload-docs:
        description: Build Haddock and upload it to Hackage on release.
        type: boolean
        default: false
      test-options:
        description: Extra options passed to the test suite on the latest build.
        type: string
        default: ""
      windows:
        description: Also build the latest GHC on Windows (in addition to Linux). Tests on Windows are controlled by `test-on-windows`.
        type: boolean
        default: false
      macos:
        description: Also build the latest GHC on macOS (in addition to Linux). Tests on macOS are controlled by `test-on-macos`.
        type: boolean
        default: false
      test-on-windows:
        description: Run the test suite on the Windows build. Only meaningful when `windows` is enabled. With the default `false`, a Windows build compiles but does not run tests.
        type: boolean
        default: false
      test-on-macos:
        description: Run the test suite on the macOS build. Only meaningful when `macos` is enabled. With the default `false`, a macOS build compiles but does not run tests.
        type: boolean
        default: false
    secrets:
      HACKAGE_TOKEN:
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  detect:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
      version: ${{ steps.detect.outputs.version }}
      candidate: ${{ steps.detect.outputs.candidate }}
      notes: ${{ steps.detect.outputs.notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect the version to release
        id: detect
        uses: nikita-volkov/changelog-driven-release.github-action@v1

  build-with-oldest:
    needs: detect
    uses: ./.github/workflows/compile-and-test.yaml
    secrets: inherit
    with:
      ghc: ${{ inputs.ghc-oldest }}
      skip-benchmarks: true
      skip-doctest: true

  build-with-latest-linux:
    needs: detect
    uses: ./.github/workflows/compile-and-test.yaml
    secrets: inherit
    with:
      ghc: ${{ inputs.ghc-latest }}
      os: ubuntu-latest
      skip-doctest: ${{ !inputs.doctest }}
      test-options: ${{ inputs.test-options }}

  build-with-latest-windows:
    needs: detect
    if: ${{ inputs.windows }}
    uses: ./.github/workflows/compile-and-test.yaml
    secrets: inherit
    with:
      ghc: ${{ inputs.ghc-latest }}
      os: windows-latest
      skip-tests: ${{ !inputs.test-on-windows }}
      skip-doctest: ${{ !inputs.doctest }}
      test-options: ${{ inputs.test-options }}

  build-with-latest-macos:
    needs: detect
    if: ${{ inputs.macos }}
    uses: ./.github/workflows/compile-and-test.yaml
    secrets: inherit
    with:
      ghc: ${{ inputs.ghc-latest }}
      os: macos-latest
      skip-tests: ${{ !inputs.test-on-macos }}
      skip-doctest: ${{ !inputs.doctest }}
      test-options: ${{ inputs.test-options }}

  format:
    if: github.event_name == 'push'
    uses: ./.github/workflows/format.yaml
    secrets: inherit
    concurrency:
      group: format-${{ github.ref }}
      cancel-in-progress: false

  sdist:
    needs: [detect, format]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    uses: ./.github/workflows/sdist.yaml
    secrets: inherit
    with:
      version: ${{ needs.detect.outputs.ready == 'true' && needs.detect.outputs.version || '' }}

  haddock:
    needs: [detect, format]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    uses: ./.github/workflows/haddock.yaml
    secrets: inherit
    with:
      version: ${{ needs.detect.outputs.ready == 'true' && needs.detect.outputs.version || '' }}

  deploy-docs:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: haddock
    uses: ./.github/workflows/deploy-docs.yaml
    permissions:
      pages: write
      id-token: write

  release:
    needs: [detect, build-with-oldest, build-with-latest-linux, build-with-latest-windows, build-with-latest-macos, sdist, haddock]
    if: >-
      ${{ !cancelled()
      && github.event_name == 'push'
      && needs.detect.outputs.ready == 'true'
      && needs.build-with-oldest.result == 'success'
      && needs.build-with-latest-linux.result == 'success'
      && (needs.build-with-latest-windows.result == 'success' || needs.build-with-latest-windows.result == 'skipped')
      && (needs.build-with-latest-macos.result == 'success' || needs.build-with-latest-macos.result == 'skipped')
      && needs.sdist.result == 'success'
      && needs.haddock.result == 'success' }}
    uses: ./.github/workflows/release.yaml
    secrets: inherit
    with:
      version: ${{ needs.detect.outputs.version }}
      candidate: ${{ needs.detect.outputs.candidate == 'true' }}
      notes: ${{ needs.detect.outputs.notes }}
      upload-docs: ${{ inputs.upload-docs }}
