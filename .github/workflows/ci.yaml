name: CI

on:
  workflow_call:
    inputs:
      ghc-oldest:
        description: Oldest GHC version to build with (e.g. "8.10").
        type: string
        default: "8.10"
      ghc-latest:
        description: Latest GHC version to build with (e.g. "latest").
        type: string
        default: latest
      doctest:
        description: Whether to run doctests on the latest build.
        type: boolean
        default: false
      upload-docs:
        description: Build Haddock and upload it to Hackage on release.
        type: boolean
        default: false
      test-options:
        description: Extra options passed to the test suite on the latest build.
        type: string
        default: ""
    secrets:
      HACKAGE_TOKEN:
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  detect:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
      version: ${{ steps.detect.outputs.version }}
      candidate: ${{ steps.detect.outputs.candidate }}
      notes: ${{ steps.detect.outputs.notes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect the version to release
        id: detect
        uses: nikita-volkov/changelog-driven-release.github-action@v1

  build-with-oldest:
    needs: detect
    uses: ./.github/workflows/compile-and-test.yaml
    secrets: inherit
    with:
      ghc: ${{ inputs.ghc-oldest }}
      skip-benchmarks: true
      skip-doctest: true

  build-with-latest:
    needs: detect
    uses: ./.github/workflows/compile-and-test.yaml
    secrets: inherit
    with:
      ghc: ${{ inputs.ghc-latest }}
      skip-doctest: ${{ !inputs.doctest }}
      test-options: ${{ inputs.test-options }}

  format:
    if: github.event_name == 'push'
    uses: ./.github/workflows/format.yaml
    secrets: inherit
    concurrency:
      group: format-${{ github.ref }}
      cancel-in-progress: false

  sdist:
    needs: [detect, format]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    uses: ./.github/workflows/sdist.yaml
    secrets: inherit
    with:
      version: ${{ needs.detect.outputs.ready == 'true' && needs.detect.outputs.version || '' }}

  haddock:
    needs: [detect, format]
    if: ${{ !cancelled() && needs.detect.result == 'success' && (needs.format.result == 'success' || needs.format.result == 'skipped') }}
    uses: ./.github/workflows/haddock.yaml
    secrets: inherit
    with:
      version: ${{ needs.detect.outputs.ready == 'true' && needs.detect.outputs.version || '' }}

  deploy-docs:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: haddock
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-docs-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the GitHub Pages docs
        uses: actions/download-artifact@v4
        with:
          name: pages-docs
          path: pages-docs

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [detect, build-with-oldest, build-with-latest, format, sdist, haddock]
    if: github.event_name == 'push' && needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ needs.detect.outputs.version }}
      cancel-in-progress: false
    environment:
      name: hackage
      url: ${{ steps.generate-hackage-url.outputs.url }}
    steps:
      - name: Check whether this version is already released
        id: check-tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/v${{ needs.detect.outputs.version }}" >/dev/null 2>&1; then
            echo "Version v${{ needs.detect.outputs.version }} is already released, skipping."
            echo "already-released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-released=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.check-tag.outputs.already-released != 'true'
        with:
          fetch-depth: 0

      - name: Set package version
        if: steps.check-tag.outputs.already-released != 'true'
        uses: nikita-volkov/edit-cabal-version.github-action@v1
        with:
          mode: set
          set-value: ${{ needs.detect.outputs.version }}

      - name: Extract package name and generate Hackage URL
        if: steps.check-tag.outputs.already-released != 'true'
        id: generate-hackage-url
        run: |
          cabal_file=$(find . -maxdepth 1 -name "*.cabal" -print -quit)
          package_name=$(awk -F ":[[:space:]]*" 'tolower($1)=="name" { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2 }' < "$cabal_file")
          if [ "${{ needs.detect.outputs.candidate }}" = "true" ]; then
            url="https://hackage.haskell.org/package/${package_name}/candidates"
          else
            url="https://hackage.haskell.org/package/${package_name}-${{ needs.detect.outputs.version }}"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Download the source distribution
        if: steps.check-tag.outputs.already-released != 'true'
        uses: actions/download-artifact@v4
        with:
          name: sdist

      - name: Download the Hackage docs tarball
        if: steps.check-tag.outputs.already-released != 'true' && inputs.upload-docs
        uses: actions/download-artifact@v4
        with:
          name: hackage-docs

      - name: Publish on Hackage (with docs)
        if: steps.check-tag.outputs.already-released != 'true' && inputs.upload-docs
        uses: haskell-actions/hackage-publish@v1.1
        with:
          hackageToken: ${{ secrets.HACKAGE_TOKEN }}
          publish: ${{ needs.detect.outputs.candidate != 'true' }}
          docsPath: dist-newstyle

      - name: Publish on Hackage
        if: steps.check-tag.outputs.already-released != 'true' && !inputs.upload-docs
        uses: haskell-actions/hackage-publish@v1.1
        with:
          hackageToken: ${{ secrets.HACKAGE_TOKEN }}
          publish: ${{ needs.detect.outputs.candidate != 'true' }}

      - name: Commit the version update
        if: steps.check-tag.outputs.already-released != 'true' && needs.detect.outputs.candidate != 'true'
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Set package version to ${{ needs.detect.outputs.version }}
          file_pattern: "*.cabal CHANGELOG.md"

      - name: Create GitHub release
        if: steps.check-tag.outputs.already-released != 'true' && needs.detect.outputs.candidate != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          name: v${{ needs.detect.outputs.version }}
          body: ${{ needs.detect.outputs.notes }}
          target_commitish: ${{ steps.commit.outputs.commit_hash }}
          files: dist-newstyle/sdist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
